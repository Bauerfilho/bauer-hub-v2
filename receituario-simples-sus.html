<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receituário Médico — Padrão SUS (2 vias)</title>
<style>
  :root{
    --ink:#000;
    --line:.35mm solid #000;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#3a3d42; }
  body{ font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; color:var(--ink); }

  /* ============ TOOLBAR (somente tela) ============ */
  .toolbar{
    position:sticky; top:0; z-index:50;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    padding:12px 18px;
    background:rgba(24,26,30,.92); backdrop-filter:blur(10px);
    color:#e8e8ec; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .toolbar h1{ font-size:14px; font-weight:600; letter-spacing:.02em; margin-right:auto; }
  .toolbar h1 small{ display:block; font-size:11px; font-weight:400; color:#9a9aa3; margin-top:2px; }
  .btn{
    font:inherit; font-size:13px; font-weight:600;
    padding:8px 16px; border-radius:9px; border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.08); color:#e8e8ec; cursor:pointer;
  }
  .btn.primary{ background:#0a84ff; border-color:#0a84ff; color:#fff; }
  .btn:active{ transform:translateY(1px); }
  .status{ width:100%; font-size:12px; color:#ffb84d; display:none; }
  .status.show{ display:block; }

  /* ============ FOLHA A4 PAISAGEM ============ */
  .stage{ display:flex; justify-content:center; padding:22px 10px 60px; }
  .sheet{
    width:297mm; height:210mm; flex:0 0 auto;
    background:#fff; box-shadow:0 8px 40px rgba(0,0,0,.45);
    display:flex; position:relative;
  }
  .via{
    width:148.5mm; height:210mm;
    padding:9mm 8mm 8mm 8mm;
    display:flex; flex-direction:column;
  }
  .cutline{
    position:absolute; left:148.5mm; top:0; height:210mm; width:0;
    border-left:.25mm dashed #777;
  }
  .cutline::before{
    content:"\2702"; position:absolute; top:2mm; left:-2.2mm;
    font-size:3.4mm; color:#777; background:#fff; line-height:1;
  }

  /* ============ DOCUMENTO ============ */
  .inst{ text-align:center; }
  .inst input{ text-align:center; border-bottom:0; }
  .field::placeholder{ color:#b9b9c0; font-weight:400; letter-spacing:normal; }
  @media print{ .field::placeholder{ color:transparent; } }
  .inst .l1{ font-size:9pt; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .inst .l2{ font-size:8.4pt; font-weight:600; text-transform:uppercase; letter-spacing:.04em; margin-top:.6mm; }
  .inst-grid{ margin-top:1.6mm; border-top:var(--line); padding-top:1.6mm; }

  .doc-title{
    text-align:center; font-size:13pt; font-weight:700;
    letter-spacing:.12em; text-transform:uppercase; margin-top:3mm;
  }
  .via-tag{
    text-align:center; font-size:7pt; letter-spacing:.14em;
    font-weight:600; margin-top:1mm;
  }

  .frow{ display:flex; align-items:flex-end; gap:2mm; margin-top:1.8mm; }
  .frow .lbl{ font-size:7.6pt; white-space:nowrap; padding-bottom:.4mm; }
  .field{
    font:inherit; font-size:9.5pt; color:var(--ink);
    border:0; border-bottom:var(--line); background:transparent;
    width:100%; min-width:0; padding:0 0 .4mm 0; border-radius:0;
    outline:none;
  }
  .field:focus{ background:#fffbe0; }
  .field.miss{ background:#ffe3e3; }
  .w-sm{ flex:0 0 14mm; } .w-md{ flex:0 0 30mm; } .w-lg{ flex:1 1 auto; }

  .pac{ margin-top:3mm; }

  .rx{ margin-top:3.4mm; flex:1 1 auto; display:flex; flex-direction:column; min-height:0; border-top:var(--line); padding-top:1.8mm; }
  .rx .rx-label{ font-size:8.4pt; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .rx textarea{
    flex:1 1 auto; width:100%; resize:none; border:0; outline:none;
    font:inherit; font-size:10.5pt; line-height:1.55; color:var(--ink);
    background:transparent; padding:1.4mm 0 0 0; overflow:hidden;
  }
  .rx textarea:focus{ background:#fffbe0; }
  .rx textarea.miss,.rx textarea.overflow{ background:#ffe3e3; }

  .sign{ display:flex; gap:8mm; align-items:flex-end; margin-top:3mm; border-top:var(--line); padding-top:4mm; }
  .sign .date{ flex:0 0 42mm; }
  .sign .sig{ flex:1 1 auto; text-align:center; }
  .sigline{ border-top:var(--line); padding-top:.9mm; font-size:7pt; letter-spacing:.03em; }
  .sign .sig .space{ height:9mm; }

  /* Via 2 = espelho somente leitura */
  .via[data-via="2"] .field,
  .via[data-via="2"] textarea{ pointer-events:none; }

  /* ============ IMPRESSÃO ============ */
  @media print{
    @page{ size:A4 landscape; margin:0; }
    html,body{ background:#fff; }
    .toolbar{ display:none !important; }
    .stage{ display:block; padding:0; }
    .sheet{ box-shadow:none; width:297mm; height:210mm; }
    .field:focus,.rx textarea:focus{ background:transparent; }
    .field.miss,.rx textarea.miss,.rx textarea.overflow{ background:transparent; }
  }

  @media screen and (max-width:1200px){
    .stage{ justify-content:flex-start; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <h1>Receituário Médico — Padrão SUS (2 vias)
    <small>Preencha a 1ª via (esquerda) — a 2ª via espelha automaticamente. Carimbo e assinatura: à mão. Prescreva pelo nome genérico (DCB — Lei 9.787/1999), com concentração, forma farmacêutica, posologia, via e duração.</small>
  </h1>
  <button class="btn" id="btnClear" type="button">Limpar</button>
  <button class="btn primary" id="btnPrint" type="button">Imprimir</button>
  <div class="status" id="status" role="alert"></div>
</div>

<noscript><p style="color:#fff;text-align:center;padding:20px">Este documento requer JavaScript para o espelhamento da 2ª via.</p></noscript>

<div class="stage">
  <div class="sheet" id="sheet">
    <div class="cutline" aria-hidden="true"></div>
  </div>
</div>

<template id="via-tpl">
  <section class="via">
    <div class="inst">
      <div class="frow" style="margin-top:0"><input class="field l1" data-f="inst_orgao" data-req="1" autocomplete="off" placeholder="PREFEITURA / ÓRGÃO GESTOR"></div>
      <div class="frow" style="margin-top:.4mm"><input class="field l2" data-f="inst_secretaria" autocomplete="off" placeholder="SECRETARIA MUNICIPAL DE SAÚDE"></div>
      <div class="inst-grid">
        <div class="frow" style="margin-top:0">
          <span class="lbl">Unidade de Saúde:</span><input class="field w-lg" data-f="inst_unidade" data-req="1" autocomplete="off">
          <span class="lbl">CNES:</span><input class="field w-md" data-f="inst_cnes" autocomplete="off">
        </div>
        <div class="frow">
          <span class="lbl">Endereço:</span><input class="field w-lg" data-f="inst_end" autocomplete="off">
          <span class="lbl">Tel.:</span><input class="field w-md" data-f="inst_tel" autocomplete="off">
        </div>
      </div>
    </div>

    <div class="doc-title">Receituário Médico</div>
    <div class="via-tag" data-slot="viatag"></div>

    <div class="pac">
      <div class="frow"><span class="lbl">Paciente:</span><input class="field w-lg" data-f="pac_nome" data-req="1" autocomplete="off"></div>
      <div class="frow">
        <span class="lbl">CNS:</span><input class="field w-lg" data-f="pac_cns" autocomplete="off">
        <span class="lbl">Data de nascimento:</span><input class="field w-md" data-f="pac_nasc" autocomplete="off" style="text-align:center">
      </div>
      <div class="frow"><span class="lbl">Endereço:</span><input class="field w-lg" data-f="pac_end" autocomplete="off"></div>
    </div>

    <div class="rx">
      <div class="rx-label">Prescrição</div>
      <textarea data-f="rx" data-req="1" spellcheck="false" autocomplete="off"></textarea>
    </div>

    <div class="sign">
      <div class="date frow" style="margin-top:0"><span class="lbl">Data:</span><input class="field" data-f="data" data-req="1" autocomplete="off" style="text-align:center"></div>
      <div class="sig"><div class="space"></div><div class="sigline">Assinatura e carimbo do prescritor (CRM)</div></div>
    </div>
  </section>
</template>

<script>
(function(){
  "use strict";
  var sheet = document.getElementById('sheet');
  var tpl = document.getElementById('via-tpl');
  var status = document.getElementById('status');

  function buildVia(n){
    var frag = tpl.content.cloneNode(true);
    var via = frag.querySelector('.via');
    via.setAttribute('data-via', String(n));
    via.querySelector('[data-slot="viatag"]').textContent =
      n === 1 ? '1ª VIA — FARMÁCIA' : '2ª VIA — PACIENTE';
    if(n === 2){
      via.querySelectorAll('.field, textarea').forEach(function(el){
        el.readOnly = true; el.tabIndex = -1; el.setAttribute('aria-hidden','true');
      });
    }
    return via;
  }

  var via1 = buildVia(1);
  var via2 = buildVia(2);
  sheet.insertBefore(via1, sheet.firstChild);
  sheet.appendChild(via2);

  function f1(key){ return via1.querySelector('[data-f="'+key+'"]'); }
  function f2(key){ return via2.querySelector('[data-f="'+key+'"]'); }
  var keys = Array.prototype.map.call(via1.querySelectorAll('[data-f]'), function(el){ return el.getAttribute('data-f'); });

  function mirror(key){ f2(key).value = f1(key).value; }
  function mirrorAll(){ keys.forEach(mirror); checkOverflow(); }

  via1.addEventListener('input', function(e){
    var k = e.target.getAttribute && e.target.getAttribute('data-f');
    if(k){ e.target.classList.remove('miss'); mirror(k); if(k==='rx') checkOverflow(); }
  });

  /* Máscara leve de data: dd/mm/aaaa (data de emissão e nascimento) */
  ['data','pac_nasc'].forEach(function(key){
    var el = f1(key);
    el.addEventListener('input', function(){
      var v = el.value.replace(/[^\d]/g,'').slice(0,8);
      if(v.length > 4) v = v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);
      else if(v.length > 2) v = v.slice(0,2)+'/'+v.slice(2);
      el.value = v; mirror(key);
    });
  });

  function today(){
    var d = new Date();
    var p = function(x){ return (x<10?'0':'')+x; };
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();
  }

  function checkOverflow(){
    var t1 = f1('rx'), t2 = f2('rx');
    var over = t1.scrollHeight > t1.clientHeight + 1;
    t1.classList.toggle('overflow', over);
    t2.classList.toggle('overflow', over);
    if(over){
      status.textContent = 'Atenção: a prescrição excede a área imprimível da via. Reduza o texto — o excedente NÃO será impresso.';
      status.classList.add('show');
    } else if(status.textContent.indexOf('excede') !== -1){
      status.textContent = ''; status.classList.remove('show');
    }
    return over;
  }

  function clearAll(){
    keys.forEach(function(k){
      f1(k).value = ''; f2(k).value = '';
      f1(k).classList.remove('miss','overflow');
      f2(k).classList.remove('miss','overflow');
    });
    f1('data').value = today(); mirror('data');
    status.textContent = ''; status.classList.remove('show');
  }

  document.getElementById('btnClear').addEventListener('click', function(){
    if(confirm('Limpar todos os campos?')) clearAll();
  });

  document.getElementById('btnPrint').addEventListener('click', function(){
    var missing = [];
    var names = { inst_orgao:'Órgão/Prefeitura', inst_unidade:'Unidade de Saúde',
      pac_nome:'Nome do paciente', rx:'Prescrição', data:'Data' };
    keys.forEach(function(k){
      var el = f1(k);
      if(el.getAttribute('data-req') && !el.value.trim()){
        el.classList.add('miss'); missing.push(names[k] || k);
      }
    });
    mirrorAll();
    if(checkOverflow()){
      alert('A prescrição excede a área imprimível. Reduza o texto antes de imprimir.');
      return;
    }
    if(missing.length){
      status.textContent = 'Campos obrigatórios vazios: ' + missing.join(', ') + '.';
      status.classList.add('show');
      if(!confirm('Campos obrigatórios vazios:\n\n• ' + missing.join('\n• ') + '\n\nUma receita incompleta pode ser recusada na dispensação. Imprimir mesmo assim?')) return;
    }
    window.print();
  });

  /* Placeholders jamais vão ao papel: removidos fisicamente antes de imprimir */
  var phEls = [], phStripped = false;
  window.addEventListener('beforeprint', function(){
    if(phStripped) return;
    phEls = [];
    document.querySelectorAll('[placeholder]').forEach(function(el){
      phEls.push([el, el.getAttribute('placeholder')]);
      el.removeAttribute('placeholder');
    });
    phStripped = true;
  });
  window.addEventListener('afterprint', function(){
    phEls.forEach(function(p){ p[0].setAttribute('placeholder', p[1]); });
    phStripped = false;
  });

  /* Sempre iniciar em branco (inclusive ao voltar do cache do navegador) */
  window.addEventListener('pageshow', function(){ clearAll(); });
  clearAll();
})();
</script>
</body>
</html>
