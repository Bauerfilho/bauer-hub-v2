<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Formulários UBS 2026 — F1</title>
  <link rel="stylesheet" href="f1/f1.css">
</head>
<body>
  <a class="skip-link" href="#f1-formulario">Ir para o formulário</a>

  <main class="app-shell" aria-labelledby="app-title">
    <header class="app-header">
      <div>
        <p class="eyebrow">Clínica do Orquestrador · uso local e offline</p>
        <h1 id="app-title">Formulários UBS 2026</h1>
        <p class="app-subtitle">Preencha somente a primeira via. A segunda é derivada em tempo real.</p>
      </div>

      <div class="privacy-badge" role="status">
        <span aria-hidden="true">●</span>
        Estado efêmero: recarregar apaga os dados
      </div>
    </header>

    <section class="toolbar" aria-label="Controles do documento">
      <label class="selector-label" for="f1-documento">Documento</label>
      <select id="f1-documento" class="document-selector"></select>
      <span id="f1-progress" class="document-progress" aria-live="polite"></span>
      <div class="toolbar-actions">
        <button id="f1-novo" class="button button-secondary" type="button">Novo paciente</button>
        <button id="f1-imprimir" class="button button-primary" type="button">Validar e imprimir</button>
      </div>
    </section>

    <div id="f1-alerta" class="app-alert" role="alert" tabindex="-1" hidden></div>

    <section class="paper-viewport" aria-label="Pré-visualização da folha A4">
      <div id="f1-formulario" class="print-sheet" role="region" aria-live="polite" aria-label="Formulário ativo"></div>
    </section>
  </main>

  <script src="f1/registro.js"></script>
  <script src="f1/templates/atestado.js"></script>
  <script src="f1/templates/encaminhamento.js"></script>
  <script src="f1/templates/encaminhamento-planejamento-familiar.js"></script>
  <script src="f1/templates/exames-pre-natal.js"></script>
  <script src="f1/templates/exames-labs-rotina.js"></script>
  <script src="f1/templates/exames-simples.js"></script>
  <script src="f1/templates/formula-lactea.js"></script>
  <script src="f1/templates/fraldas-pediatricas.js"></script>
  <script src="f1/templates/insumos.js"></script>
  <script src="f1/templates/mrpa.js"></script>
  <script src="f1/templates/puerpera.js"></script>
  <script src="f1/templates/controle-especial.js"></script>
  <script src="f1/templates/receituario-gestante.js"></script>
  <script src="f1/templates/receituario-rn.js"></script>
  <script src="f1/templates/tabela-pa.js"></script>
  <script src="f1/templates/esquema-insulina.js"></script>
  <script src="f1/templates/plano-visual-medicamentos.js"></script>
  <script src="f1/templates/controle-glicemico.js"></script>
  <script src="f1/motor.js"></script>
</body>
</html>
